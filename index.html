<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Tairuzz Analytics</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            font-family: Arial, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* HEADER */
        .header {
            height: 52px;
            background: #1f1f1f;
            color: white;
            display: flex;
            align-items: center;
            padding: 0 16px;
            flex-shrink: 0;
        }

        .header img {
            height: 32px;
            margin-right: 12px;
        }

        .header-title {
            font-size: 16px;
            font-weight: 500;
        }

        /* MAIN LAYOUT */
        .layout {
            display: flex;
            height: calc(100% - 52px);
            width: 100%;
        }

        /* LEFT NAV (scrollable) */
        #sideNav {
            width: 220px;
            background: #2a2a2a;
            color: #e0e0e0;
            border-right: 1px solid #3a3a3a;
            padding: 12px 0;
            overflow-y: auto;
            flex-shrink: 0;
        }

        #sideNav button {
            width: 100%;
            padding: 12px 16px;
            background: none;
            border: none;
            text-align: left;
            color: #e0e0e0;
            font-size: 14px;
            cursor: pointer;
        }

        #sideNav button:hover {
            color: #ffcc00;
        }

        #sideNav button.activePage {
            color: #3aa6ff;
            background: #1f1f1f;
            border-left: 3px solid #3aa6ff;
        }

        /* REPORT AREA */
        #mainContent {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        #loader {
            padding: 20px;
            font-size: 20px;
            font-weight: 600;
            display: none;
        }

        #embedContainer {
            flex: 1;
            width: 100%;
            height: 100%;
            position: relative;
        }

        #embedContainer iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100% !important;
            height: 100% !important;
            border: none;
        }
    </style>
</head>

<body>

    <!-- AUTH CHECK -->
    <script>
        if (!localStorage.getItem("tairuzz_auth")) {
            window.location.href = "/login.html";
        }
    </script>

    <!-- HEADER -->
    <div class="header">
        <img src="club-logo.png" alt="Club Logo">
        <div class="header-title">Club A Analytics</div>
    </div>

    <!-- MAIN LAYOUT -->
    <div class="layout">

        <!-- LEFT SCROLLABLE NAV -->
        <div id="sideNav">
            <button data-page="League Table">League Table</button>
            <button data-page="Profile">Profile</button>
            <button data-page="Performance Rank">Performance Rank</button>
            <button data-page="Goal Impact">Goal Impact</button>
            <button data-page="Season on Season player">Season on Season player</button>
            <button data-page="Season on season club">Season on Season Club</button>
            <button data-page="Fixture Results by xG">Fixture Results by xG</button>
            <button data-page="Team Results by xG">Team Results by xG</button>
            <button data-page="Title Race">Title Race</button>
            <button data-page="Fixtures and Result">Fixtures and Result</button>
            <button data-page="Attack Threat">Attack Threat</button>
            <button data-page="KPIs Plot">KPIs Plot</button>
            <button data-page="Performance Metrics">Performance Metrics</button>
            <button data-page="Team fixture Performance ">Team Fixture Performance</button>
            <button data-page="Compare Performance Metrics">Compare Performance Metrics</button>
            <button data-page="Goal Placement">Goal Placement</button>
            <button data-page="Goal Categories">Goal Categories</button>
            <button data-page="Goal Categories2">Goal Categories2</button>
            <button data-page="Goal Analysis">Goal Analysis</button>
        </div>

        <!-- REPORT AREA -->
        <div id="mainContent">
            <div id="loader">Loading report…</div>
            <div id="embedContainer"></div>
        </div>

    </div>

    <!-- POWER BI -->
    <script src="https://cdn.jsdelivr.net/npm/powerbi-client@2.22.0/dist/powerbi.min.js?v=999999"></script>
    <script src="index.js"></script>

</body>
</html>
